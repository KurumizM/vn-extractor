<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>VN Extractor</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
        .img-container { max-width: 100%; margin-top: 1rem; display: none; }
        img { max-width: 100%; }
        button { background: #2ea44f; color: white; border: none; padding: 10px 15px; cursor: pointer; border-radius: 6px; }
        #results { margin-top: 1rem; background: #f6f8fa; padding: 1rem; border: 1px solid #d0d7de; border-radius: 6px; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h2>Upload Video & Extract Dialogue</h2>
    
    <form id="uploadForm">
        <input type="file" id="videoFile" accept="video/*" required>
        <button type="submit">Upload</button>
    </form>

    <div class="img-container">
        <p>Drag to crop the dialogue box:</p>
        <img id="previewImage" src="">
        <button id="extractBtn" style="margin-top: 1rem;">Extract Text</button>
    </div>

    <div id="results">Extracted text will appear here...</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <script>
        let cropper;
        let videoFilename = "";

        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData();
            formData.append('video', document.getElementById('videoFile').files[0]);

            const res = await fetch('/upload', { method: 'POST', body: formData });
            const data = await res.json();

            if (data.success) {
                videoFilename = data.filename;
                const previewImage = document.getElementById('previewImage');
                previewImage.src = data.preview_url + '?t=' + Date.now();
                document.querySelector('.img-container').style.display = 'block';
                
                if (cropper) cropper.destroy();
                cropper = new Cropper(previewImage, { viewMode: 1, zoomable: false });
            }
        });

        document.getElementById('extractBtn').addEventListener('click', async () => {
            if (!cropper) return;
            const cropData = cropper.getData(true);
            document.getElementById('results').innerText = "Processing...";

            const res = await fetch('/extract', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ filename: videoFilename, ...cropData })
            });
            const data = await res.json();
            document.getElementById('results').innerText = data.script || "No text found.";
        });
    </script>
</body>
</html>
